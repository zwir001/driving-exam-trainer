# Same behaviour as tools/serve.py: built app at /, resources/ at /resources/,
# unknown paths fall back to index.html (app routes, e.g. /learn). nginx handles Range requests itself.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /resources/ {
        root /usr/share/nginx;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
